    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MT3DKL07EW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MT3DKL07EW');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="lightbox.css">
</head>

<body>

    <header>
        <h1>AntonioTorresFoto</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="naturaleza.html">Naturaleza</a>
            <a href="religiosidad_popular.html">Religiosidad Popular</a>
            <a href="viajes.html">Viajes</a>
            <a href="sobremi.html">Sobre mí</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <h2>Aves</h2>

        <div class="galeria">

            <img data-indice="0"
                 src="Fotos/Fauna/aves/galeria/aves 1.jpg"
                 alt="Arrendajo euroasiático (Garrulus glandarius)"
                 loading="lazy"
                 onclick="abrirLightbox(0, 'Fotos/Fauna/aves/lightbox/aves 1.jpg', 'Arrendajo euroasiático <em>Garrulus glandarius</em><br>Canon Rf 100-400 mm f/5,6-8 IS USM. Longitud focal 400 mm. f/9 a 1/640 s. ISO 3200<br>26/09/2026')">

            <img data-indice="1"
                 src="Fotos/Fauna/aves/galeria/aves 2.jpg"
                 alt="Abejarruco europeo (Merops apiaster)"
                 loading="lazy"
                 onclick="abrirLightbox(1, 'Fotos/Fauna/aves/lightbox/aves 2.jpg', 'Abejarruco europeo <em>Merops apiaster</em><br>Canon Rf 100-400 mm f/5,6-8 IS USM. Longitud focal 400 mm. f/8 a 1/1000 s. ISO 3200<br>10/09/2026')">

        </div>
    </main>

    <div id="lightbox"
         class="lightbox"
         role="dialog"
         aria-modal="true"
         aria-label="Visor de fotos ampliadas">

        <button class="pantalla-completa" onclick="togglePantallaCompleta()" aria-label="Pantalla completa" title="Pantalla completa">&#9974;</button>
        <button class="cerrar" onclick="cerrarLightbox()" aria-label="Cerrar visor">&times;</button>
        <button class="anterior" onclick="fotoAnterior()" aria-label="Foto anterior">&#10094;</button>
        <img id="imagenLightbox" class="imagen-lightbox" alt="Foto ampliada">
        <button class="siguiente" onclick="fotoSiguiente()" aria-label="Foto siguiente">&#10095;</button>
        <p id="textoLightbox" class="texto-lightbox"></p>
    </div>

    <script src="lightbox.js"></script>

    <footer class="footer">
        <p>&copy; 2026 Antonio Torres · Fotografía</p>
    </footer>

</body>
</html>
