<div id="lightbox" class="lightbox">

    <span class="cerrar" onclick="cerrarLightbox()">&times;</span>

    <span class="anterior" onclick="fotoAnterior()">&#10094;</span>

    <img id="imagenLightbox" class="imagen-lightbox">

    <span class="siguiente" onclick="fotoSiguiente()">&#10095;</span>

    <p id="textoLightbox" class="texto-lightbox"></p>

</div>

<script>

let indiceActual = 0;

const fotos = [];

function abrirLightbox(indice, imagen, texto) {

    indiceActual = indice;

    fotos[indice] = {
        imagen: imagen,
        texto: texto
    };

    document.getElementById("lightbox").style.display = "flex";

    document.getElementById("imagenLightbox").src = imagen;

    document.getElementById("textoLightbox").innerText = texto;
}

function fotoAnterior() {

    let nuevoIndice = indiceActual - 1;

    if (nuevoIndice < 0) {
        nuevoIndice = document.querySelectorAll('[data-indice]').length - 1;
    }

    document.querySelector(
        '[data-indice="' + nuevoIndice + '"]'
    ).click();
}

function fotoSiguiente() {

    let nuevoIndice = indiceActual + 1;

    const totalFotos = document.querySelectorAll('[data-indice]').length;

    if (nuevoIndice >= totalFotos) {
        nuevoIndice = 0;
    }

    document.querySelector(
        '[data-indice="' + nuevoIndice + '"]'
    ).click();
}

function cerrarLightbox() {

    document.getElementById("lightbox").style.display = "none";

}

</script>
